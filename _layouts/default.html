<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }}</title>
<meta name="description" content="PM Tool Local의 앱 소개 및 개인정보처리방침. Google 원장 읽기 전용 조회와 로컬 프로젝트 운영 도구.">
<style>
:root {color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:#182a43;background:#f3f6fa}
* {box-sizing:border-box}
body {margin:0;font-size:1rem;line-height:1.85}
header,main,footer {max-width:860px;margin:auto;padding:24px}
header {display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header a {font-weight:650} nav {display:flex;gap:20px;flex-wrap:wrap}
main {background:white;border:1px solid #d9e2ef;border-radius:12px;padding:32px 40px}
h1 {font-size:2rem;line-height:1.35;margin:0 0 24px}
h2 {font-size:1.25rem;margin-top:36px;line-height:1.5}
a {color:#2454a4;text-underline-offset:4px;overflow-wrap:anywhere}
a:focus-visible {outline:3px solid #2454a4;outline-offset:4px}
p,li {overflow-wrap:anywhere}
code {background:#edf2f8;padding:2px 5px;border-radius:4px}
footer {font-size:.9rem;color:#53637a}
.skip {position:absolute;left:12px;top:-80px;background:white;padding:8px}
.skip:focus {top:8px}
@media(max-width:600px) {header,footer {padding:20px} main {border-radius:0;padding:24px 20px} h1 {font-size:1.7rem}}
</style>
</head>
<body>
<a class="skip" href="#content">본문으로 건너뛰기</a>
<header><a href="{{ '/' | relative_url }}">PM Tool Local</a><nav aria-label="안내"><a href="{{ '/' | relative_url }}">앱 소개</a><a href="{{ '/privacy.html' | relative_url }}">개인정보처리방침</a></nav></header>
<main id="content">{{ content }}</main>
<footer>운영자 julyinsung · <a href="mailto:julyinsung@gmail.com">julyinsung@gmail.com</a><br>개인용 로컬 프로젝트 운영 도구 · 이 사이트는 소개 및 정책 안내만 제공합니다.</footer>
</body>
</html>
